  eurooffice:
    container_name: euro-office
    image: ghcr.io/euro-office/documentserver:latest
    restart: unless-stopped
    #ports:
    #        - 80:80
    networks:
      proxy:
    environment:
        - JWT_ENABLED=true
        - JWT_SECRET=${JWT_SECRET}
    #volumes:
    #    - /pool/docker/nc-eurooffice/data:/var/lib/euro-office/documentserver
    #    - /pool/docker/nc-eurooffice/logs:/var/log/euro-office/documentserver
    #    - /pool/docker/nc-eurooffice/config:/etc/euro-office/documentserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eurooffice-nc.rule=Host(`${EUROOFFICE_HOST}`)"
      - "traefik.http.routers.eurooffice-nc.entrypoints=websecure"
      - "traefik.http.routers.eurooffice-nc.tls=true"
      - "traefik.http.routers.eurooffice-nc.tls.certresolver=letsencrypt"
      - "traefik.http.services.eurooffice-nc.loadbalancer.server.port=80"

  nc-talk:
    container_name: talk_hpb
    image: ghcr.io/nextcloud-releases/aio-talk:latest
    init: true
    ports:
      - 3478:3478/tcp
      - 3478:3478/udp
#      - 8181:8081/tcp
    networks:
      proxy:
    environment:
      - NC_DOMAIN=${NC_HOST}
      - TALK_HOST=${TALK_HOST}
      - TURN_SECRET=${TURN_SECRET}
      - SIGNALING_SECRET=${SIGNALING_SECRET}
      - TZ=Europe/Berlin
      - TALK_PORT=3478
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.signal.rule=Host(`${TALK_HOST}`)"
      - "traefik.http.routers.signal.entrypoints=websecure"
      - "traefik.http.routers.signal.tls=true"
      - "traefik.http.routers.signal.tls.certresolver=letsencrypt"
      - "traefik.http.services.signal.loadbalancer.server.port=8081"
    restart: unless-stopped

