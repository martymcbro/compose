services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v3
    container_name: arcane
    ports:
      - '3552:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /pool/docker/arcane/data:/app/data
      - /pool/docker/timelimit/timelimit-server:/pool/docker/timelimit/timelimit-server
      - /pool/compose:/pool/compose
    environment:
      - ARCANE_APP_URL=${ARCANE_APP_URL}
      - PUID=1000
      - PGID=100
      - ARCANE_ENCRYPTION_KEY=${ARCANE_ENCRYPTION_KEY}
      - ARCANE_PROJECTS_DIRECTORY=/pool/compose
    restart: unless-stopped