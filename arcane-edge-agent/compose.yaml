services:
  arcane-edge-agent:
    image: ghcr.io/getarcaneapp/agent:latest
    container_name: arcane-edge-agent
    restart: unless-stopped
    environment:
      - EDGE_AGENT=true
      - EDGE_TRANSPORT=poll
      - AGENT_TOKEN=${AGENT_TOKEN} 
      - MANAGER_API_URL=${MANAGER_API_URL}
      - PUID=1000
      - PGID=100
      - PROJECTS_DIRECTORY=/pool/compose
    volumes:
      - /pool/docker/timelimit/timelimit-server:/pool/docker/timelimit/timelimit-server
      - /var/run/docker.sock:/var/run/docker.sock
      - /pool/docker/arcane-agent/data:/app/data
      - /pool/compose:/pool/compose