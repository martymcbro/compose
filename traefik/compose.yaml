services:
  traefik:
    image: traefik
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Berlin
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - TRAEFIK_DASHBOARD_CREDENTIALS=${TRAEFIK_DASHBOARD_CREDENTIALS}
    networks:
      dmz:
        ipv4_address: 192.168.178.254
    #ports:
    #  - 80:80 # HTTP entryPoints
    #  - 443:443 # HTTPS entryPoints
    #  - 8080:8080 # Dashbaord WebGui 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /pool/docker/traefik/traefik.yml:/traefik.yml:ro
      - /pool/docker/traefik/config:/config:ro
      - /pool/docker/traefik/certs:/certs
      - /pool/docker/traefik/logs:/var/log/traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_CREDENTIALS}"
      - "traefik.http.routers.traefik-secure.entrypoints=websecure"
      - "traefik.http.routers.traefik-secure.rule=Host(`${HOST}`)"
      - "traefik.http.routers.traefik-secure.middlewares=traefik-auth,default-whitelist@file"
      - "traefik.http.routers.traefik-secure.tls=true"
      - "traefik.http.routers.traefik-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-secure.tls.domains[0].main=${DOMAIN_MAIN}"
      - "traefik.http.routers.traefik-secure.tls.domains[0].sans=${DOMAIN_SANS}"
      - "traefik.http.services.traefik.loadbalancer.server.port=2283"
      - "traefik.http.routers.traefik-secure.service=api@internal"

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    ports:
      - 127.0.0.1:9876:8080 # port mapping for local firewall bouncers
    expose:
      - 8080 # http api for bouncers
      - 6060 # metrics endpoint for prometheus
      - 7422 # appsec waf endpoint
    volumes:
      # crowdsec container data
      #- ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/crowdsec/data:/var/lib/crowdsec/data
      #- ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/crowdsec/etc:/etc/crowdsec
      - /pool/docker/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml
      - /pool/docker/crowdsec/db:/var/lib/crowdsec/data/
      - /pool/docker/crowdsec/config:/etc/crowdsec/
      # log bind mounts into crowdsec
      #- /var/log/auth.log:/var/log/auth.log:ro
      #- /var/log/syslog:/var/log/syslog:ro
      #- ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/traefik/logs:/var/log/traefik:ro
      - /pool/docker/traefik/logs:/var/log/traefik/:ro
    environment:
      GID: "${GID-100}"
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/traefik"
      #- GID=1000
      #- COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/sshd crowdsecurity/linux crowdsecurity/appsec-generic-rules crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-crs crowdsecurity/appsec-bot-challenge
      #- CUSTOM_HOSTNAME=my-crowdsec-host123
    networks:
      - dmz

networks:
  dmz:
    external: true
