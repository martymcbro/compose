services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:latest
    container_name: arcane-agent
    restart: unless-stopped
    environment:
      - ARCANE_AGENT=true
      - ARCANE_AGENT_TRANSPORT=auto
      - ARCANE_AGENT_TOKEN=${ARCANE_AGENT_TOKEN} 
      - ARCANE_MANAGER_API_URL=${ARCANE_MANAGER_API_URL} 
      - PUID=1000
      - PGID=100
      - ARCANE_PROJECTS_DIRECTORY=/pool/compose
    volumes:
      - /pool/docker/timelimit/timelimit-server:/pool/docker/timelimit/timelimit-server
      - /var/run/docker.sock:/var/run/docker.sock
      - /pool/docker/arcane-agent/data:/app/data
      - /pool/compose:/pool/compose
