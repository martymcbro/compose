services:
  pocket-id:
    image: pocketid/pocket-id:v2 # or ghcr.io/pocket-id/pocket-id:v2
    restart: unless-stopped
    env_file: .env
    #ports:
    #  - 1411:1411
    networks:
      proxy:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketid.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.pocketid.entrypoints=websecure"
      - "traefik.http.routers.pocketid.tls=true"
      - "traefik.http.routers.pocketid.tls.certresolver=letsencrypt"
      - "traefik.http.services.pocketid.loadbalancer.server.port=1411"
    volumes:
      - "/pool/docker/pocketid/data:/app/data"
    # Optional healthcheck
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

networks:
  proxy:
    external: true